name: Release

# Publishes a GitHub Release, with notes generated from merged pull requests and commits, for every
# bare SemVer tag (`0.1.0`, never `v0.1.0`). Libraries ship as source, so there are no assets.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to publish a release for
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${RELEASE_VERSION}" --jq '.body' > release_notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_VERSION}" --repo "${{ github.repository }}" \
            --title "${RELEASE_VERSION}" --notes-file release_notes.md --verify-tag
