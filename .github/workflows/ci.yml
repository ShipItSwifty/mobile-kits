name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Swift version
        run: swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Format lint
        run: swift format lint --recursive --strict --configuration .swift-format Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The supported floor and the latest release.
        swift: ["6.2", "6.4"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache SwiftPM
        uses: actions/cache@v6.1.0
        with:
          path: .build
          key: linux-${{ matrix.swift }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: linux-${{ matrix.swift }}-spm-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
